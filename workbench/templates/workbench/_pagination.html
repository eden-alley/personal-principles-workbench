{% if page_obj and page_obj.paginator.num_pages > 1 %}
  <nav class="pagination" aria-label="分页">
    {% if page_obj.has_previous %}<a class="button button-quiet" href="?{% if query_params %}{{ query_params }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">上一页</a>{% else %}<span class="button button-quiet is-disabled">上一页</span>{% endif %}
    <span class="pagination-status">第 {{ page_obj.number }} / {{ page_obj.paginator.num_pages }} 页</span>
    {% if page_obj.has_next %}<a class="button button-quiet" href="?{% if query_params %}{{ query_params }}&amp;{% endif %}page={{ page_obj.next_page_number }}">下一页</a>{% else %}<span class="button button-quiet is-disabled">下一页</span>{% endif %}
  </nav>
{% endif %}
